# Example only — do NOT commit real secrets.
# Apply outside ArgoCD into each environment namespace (staging / production):
#
#   kubectl create secret generic postgres-secret \
#     --namespace staging \
#     --from-literal=POSTGRES_PASSWORD='your-password'
#
#   kubectl create secret generic postgres-secret \
#     --namespace production \
#     --from-literal=POSTGRES_PASSWORD='your-password'
#
# Optional (production backups to GCS):
#   kubectl create secret generic storage-sa-key \
#     --namespace production \
#     --from-file=key.json=./path/to/sa-key.json
#
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD_HERE"
