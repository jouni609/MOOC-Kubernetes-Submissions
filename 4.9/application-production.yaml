apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jouni609/MOOC-Kubernetes-Submissions.git
    # Only tagged commits deploy to production.
    # Course release tag is 4.9.0 (not v4.9.0):
    #   git tag 4.9.0 && git push origin 4.9.0
    # Later releases: retarget this Application to the new tag name.
    targetRevision: 4.9.0
    path: 4.9/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
