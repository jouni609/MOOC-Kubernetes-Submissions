apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dummysites.k8s.exercise
spec:
  group: k8s.exercise
  scope: Namespaced
  names:
    plural: dummysites
    singular: dummysite
    kind: DummySite
    shortNames:
      - ds
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - website_url
              properties:
                website_url:
                  type: string
                  description: URL of the website to copy and serve
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.website_url
