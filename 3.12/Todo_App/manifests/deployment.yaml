apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-dep
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      volumes:
        - name: image-storage
          persistentVolumeClaim:
            claimName: todoapp-image-pvc
      containers:
        - name: todoapp
          image: todo-app
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: todo-app-config
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "5m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: image-storage
              mountPath: /usr/src/app/files
