apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-wiki-cronjob
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: todo-job
              image: todo-job
              imagePullPolicy: Always
              env:
                - name: WIKI_URL
                  value: "https://en.wikipedia.org/wiki/Special:Random"
                - name: TODO_BACKEND_URL
                  value: "http://todo-backend-svc:2345/todos"
          restartPolicy: OnFailure
