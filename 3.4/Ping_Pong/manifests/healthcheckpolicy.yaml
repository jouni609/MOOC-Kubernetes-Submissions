apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: pingpong-healthcheck
  namespace: exercises
spec:
  default:
    checkIntervalSec: 120
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2

    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: pingpong-svc
