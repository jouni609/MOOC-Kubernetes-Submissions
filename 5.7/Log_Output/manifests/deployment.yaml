apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-storage
          emptyDir: {}
      containers:
        - name: log-output-writer
          image: jouni609/log-output-writer:5.7
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: jouni609/log-output-reader:5.7.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: PINGPONG_URL
              value: http://pingpong.exercises.svc.cluster.local/pongs
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthprobe
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files
